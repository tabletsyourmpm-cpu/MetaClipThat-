name: Build debug APK

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: gradle

      - name: Install Gradle 8.7
        # No wrapper jar is committed to the repo (kept out to avoid the
        # 128 KB GitHub App push limit), so install the official Gradle
        # 8.7 distribution directly instead of using ./gradlew.
        run: |
          curl -sL -o /tmp/gradle-dist.zip https://services.gradle.org/distributions/gradle-8.7-bin.zip
          unzip -q /tmp/gradle-dist.zip -d /tmp
          echo "/tmp/gradle-8.7/bin" >> $GITHUB_PATH

      - name: Build debug APK
        run: gradle assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MetaClipThat-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
