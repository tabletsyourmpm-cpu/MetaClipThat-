name: Build debug APK

on:
  push:
    branches: ["main", "master"]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch official Gradle wrapper jar
        # The wrapper jar is intentionally not committed (it exceeds the
        # GitHub App's push size limits). Download the official Gradle 8.7
        # wrapper jar so wrapper validation passes.
        run: |
          curl -sL -o gradle/wrapper/gradle-wrapper.jar \
            "https://github.com/gradle/gradle/raw/v8.7/gradle/wrapper/gradle-wrapper.jar"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: gradle

      - name: Set up Gradle (uses the project wrapper)
        uses: gradle/actions/setup-gradle@v4

      - name: Build debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MetaClipThat-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
